{% extends "base.html" %}
{% block content %}
<div style="text-align: center; padding: 3rem 1rem;">
  <h1 style="font-size: 2.5rem; margin-bottom: 1rem;">Bine ai venit!</h1>
  <p style="color: var(--text-muted); font-size: 1.125rem; max-width: 600px; margin: 0 auto 3rem;">
    Gestionează baza de date a magazinului tău cu o interfață rapidă și modernă.
  </p>

  <div class="stats-grid">
    <a href="{% url 'clienti_list' %}" style="text-decoration: none;">
      <div class="stat-card" style="transition: transform 0.2s;">
        <span class="stat-label">Total Clienți</span>
        <span class="stat-value">Gestionează</span>
      </div>
    </a>
    <a href="{% url 'produse_list' %}" style="text-decoration: none;">
      <div class="stat-card" style="transition: transform 0.2s;">
        <span class="stat-label">Total Produse</span>
        <span class="stat-value">Gestionează</span>
      </div>
    </a>
    <a href="{% url 'producatori_list' %}" style="text-decoration: none;">
      <div class="stat-card" style="transition: transform 0.2s;">
        <span class="stat-label">Producători</span>
        <span class="stat-value">Gestionează</span>
      </div>
    </a>
  </div>

  <div style="margin-top: 4rem; padding-top: 2rem; border-top: 1px solid var(--border);">
    <p style="font-size: 0.875rem; color: var(--text-muted);">
      Sistem de gestiune bază de date v1.0
    </p>
  </div>
</div>
{% endblock %}
