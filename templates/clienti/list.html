{% extends "base.html" %}
{% block content %}
<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
  <h2>Clienți</h2>
  <a class="btn btn-primary" href="{% url 'clienti_add' %}">Adaugă Client</a>
</div>

<div class="table-container">
  <table>
    <thead>
      <tr>
        <th>Nume</th>
        <th>Prenume</th>
        <th>Adresă</th>
        <th style="text-align: right;">Acțiuni</th>
      </tr>
    </thead>
    <tbody>
      {% for x in items %}
      <tr>
        <td style="font-weight: 500;">{{ x.nume }}</td>
        <td>{{ x.prenume }}</td>
        <td>{{ x.adresa }}</td>
        <td style="text-align: right; display: flex; gap: 0.5rem; justify-content: flex-end;">
          <a class="btn btn-ghost" href="{% url 'clienti_edit' x.pk %}" style="padding: 0.25rem 0.5rem;">Edit</a>
          {% if user.is_staff %}
          <a class="btn btn-danger" href="{% url 'clienti_delete' x.pk %}" style="padding: 0.25rem 0.5rem;">Șterge</a>
          {% endif %}
        </td>
      </tr>
      {% empty %}
      <tr>
        <td colspan="4" class="empty-state">Nu există clienți în bază.</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
